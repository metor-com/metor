# Packaging (ADR-0015). Outside the Mac App Store: Developer ID + notarization once the account
# exists (APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID and a CSC_LINK in CI); Windows with
# a code-signing certificate (CSC_LINK / CSC_KEY_PASSWORD). Without secrets the builds are unsigned.
appId: com.metor.desktop
productName: metor
copyright: metor contributors
directories:
  output: dist
  buildResources: build
files:
  - src/**
  - ui/**
  - package.json
asar: true
protocols:
  - name: metor
    schemes: [metor]
mac:
  category: public.app-category.productivity
  target:
    - { target: dmg, arch: [arm64, x64] }
    - { target: zip, arch: [arm64, x64] }
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  extendInfo:
    NSMicrophoneUsageDescription: metor uses the microphone for voice input to your bots.
    NSCameraUsageDescription: metor uses the camera only when you share it with a bot.
win:
  target:
    - { target: nsis, arch: [x64, arm64] }
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  target: [AppImage, deb]
  category: Utility
  maintainer: metor contributors
  synopsis: Delegable bots with their own computer
publish:
  provider: github
  owner: metor-com
  repo: metor
  releaseType: release

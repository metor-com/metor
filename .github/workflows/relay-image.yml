# Tests and builds the push relay (backend/relay, ADR-0017) and pushes the image to the GitHub
# Container Registry as ghcr.io/<repository owner>/metor-push. The image is a few megabytes on top
# of node:22-alpine, so both platforms are built with QEMU in one job.
name: relay-image
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["backend/relay/**", ".github/workflows/relay-image.yml"]
  pull_request:
    paths: ["backend/relay/**", ".github/workflows/relay-image.yml"]
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/metor-push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/*.test.mjs
        working-directory: backend/relay
      - name: End to end with the gateway's web-push library
        run: npm install --no-save --no-fund --no-audit web-push@3.6.7 && node scripts/webpush-e2e.mjs
        working-directory: backend/relay
  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: backend/relay
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

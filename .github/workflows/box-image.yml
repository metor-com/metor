# Builds the box image on every push to main and on version tags (v*), and pushes it to the
# GitHub Container Registry. Servers then `docker pull` instead of clone+build (see INSTALL.md).
# Two native builds (amd64 on the default runner, arm64 on GitHub's arm runner – Apple silicon
# Macs and arm servers) are pushed by digest and joined into one multi-arch tag; QEMU emulation
# would slow the Claude/npm install steps by an order of magnitude.
# The image is pushed as ghcr.io/<repository owner>/metor-box. Package visibility is switched in the GitHub package settings.
name: box-image
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/metor-box
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/box/Dockerfile
          platforms: ${{ matrix.platform }}
          # pushed by digest only – the tags are attached to the joined manifest below
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Keep the digest for the merge step
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1
  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # latest = main; v0.1.0 → 0.1.0; plus a short sha tag for pinning
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - name: Join both platforms under the tags
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
      - name: Show the result
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}

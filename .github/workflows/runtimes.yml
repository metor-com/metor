# Weekly: are there newer releases of the runtimes the box carries (Claude Agent SDK, Codex CLI,
# Gemini CLI)? If so, bump the pins in backend/box/Dockerfile, prove that the image still builds,
# and open (or refresh) a pull request. The runtimes' protocols are verified per version
# (knowledge/harness/), so a person merges – after the chat smoke ran on a real computer.
name: runtimes
on:
  schedule:
    - cron: "0 6 * * 1"   # Monday 06:00 UTC
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: bump
        name: Compare the pins with npm and bump them
        run: node scripts/runtime-versions.mjs --bump
      - name: Build the image with the new pins (not pushed)
        if: steps.bump.outputs.changes != ''
        run: docker build -f backend/box/Dockerfile . 2>&1 | tail -5
      - name: Open or refresh the pull request
        if: steps.bump.outputs.changes != ''
        uses: peter-evans/create-pull-request@v7
        with:
          branch: runtimes/bump
          title: "Runtimes: ${{ steps.bump.outputs.changes }}"
          commit-message: "Runtimes: ${{ steps.bump.outputs.changes }}"
          body: |
            Newer runtime releases on npm; the box image builds with them (this workflow).

            Before merging: `metor box build`, then `scripts/smoke.sh` with chat against that computer, and a look at
            the runtimes' release notes – the protocols metor speaks (Codex app-server, Gemini ACP, the Agent SDK) are
            verified per version in `knowledge/harness/`. Add a line under Unreleased in CHANGELOG.md when a new model
            or another visible change comes with it. A merge to main publishes the `latest` image.
          labels: runtimes
